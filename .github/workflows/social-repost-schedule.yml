name: Social Repost Schedule

# Calls /api/cron/social-repost up to 4x/day so price-change posts trickle
# out gradually instead of all at once. Runs here instead of Vercel's own
# Cron Jobs because Vercel's free Hobby plan only allows cron jobs to fire
# once a day -- GitHub Actions runs this for free (a few seconds, 4x/day)
# without needing a paid plan anywhere.
#
# Requires two repository secrets (Settings -> Secrets and variables ->
# Actions): SOCIAL_REPOST_SITE_URL (e.g. https://your-site.vercel.app) and
# CRON_SECRET, matching the CRON_SECRET environment variable set on Vercel.
on:
  schedule:
    - cron: "0 5 * * *" # ~10:00 PKT
    - cron: "0 8 * * *" # ~13:00 PKT
    - cron: "0 12 * * *" # ~17:00 PKT
    - cron: "0 15 * * *" # ~20:00 PKT
  workflow_dispatch: {}

jobs:
  trigger-repost:
    runs-on: ubuntu-latest
    steps:
      - name: Call social repost endpoint
        run: |
          curl -sf -X POST "${SOCIAL_REPOST_SITE_URL%/}/api/cron/social-repost" \
            -H "Authorization: Bearer ${CRON_SECRET}"
        env:
          SOCIAL_REPOST_SITE_URL: ${{ secrets.SOCIAL_REPOST_SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
