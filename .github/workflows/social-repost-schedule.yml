name: Social Repost Schedule

# Calls /api/cron/social-repost up to 3x/day so price-change posts trickle
# out gradually instead of all at once. Runs here instead of Vercel's own
# Cron Jobs because Vercel's free Hobby plan only allows cron jobs to fire
# once a day -- GitHub Actions runs this for free (a few seconds, 3x/day)
# without needing a paid plan anywhere.
#
# Requires two repository secrets (Settings -> Secrets and variables ->
# Actions): SOCIAL_REPOST_SITE_URL (e.g. https://your-site.vercel.app) and
# CRON_SECRET, matching the CRON_SECRET environment variable set on Vercel.
on:
  schedule:
    - cron: "0 5 * * *" # ~10:00 PKT
    - cron: "0 9 * * *" # ~14:00 PKT
    - cron: "0 14 * * *" # ~19:00 PKT
  workflow_dispatch: {}

jobs:
  trigger-repost:
    runs-on: ubuntu-latest
    steps:
      - name: Call social repost endpoint
        run: |
          http_status=$(curl -sS -o response.json -w "%{http_code}" -X POST \
            "${SOCIAL_REPOST_SITE_URL%/}/api/cron/social-repost" \
            -H "Authorization: Bearer ${CRON_SECRET}")
          echo "HTTP status: ${http_status}"
          echo "Response body:"
          cat response.json
          echo
          if [ "${http_status}" -ge 400 ]; then
            exit 1
          fi
        env:
          SOCIAL_REPOST_SITE_URL: ${{ secrets.SOCIAL_REPOST_SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
